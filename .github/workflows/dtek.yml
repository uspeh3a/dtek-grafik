name: dtek
on:
  schedule:
   - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только проверить данные, без отправки"
        type: boolean
        default: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Kyiv
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      CITY: ${{ secrets.CITY }}
      STREET: ${{ secrets.STREET }}
      HOUSE: ${{ secrets.HOUSE }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip' # Автоматическое кэширование pip (если есть requirements.txt)

      - name: Cache state
        uses: actions/cache@v4
        with:
          path: last_slots.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install Python packages
        run: pip install dtek-blackout-client pillow requests

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Install Playwright OS dependencies
        run: sudo playwright install-deps chromium

      - name: Run script
        run: python dtek_to_tg.py
